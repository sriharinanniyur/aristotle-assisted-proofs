name = "lean-multiplication"
defaultTargets = ["LeanMultiplication"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "LeanMultiplication"
globs = ["LeanMultiplication.+"]
